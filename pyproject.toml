[build-system]
requires = [ "poetry-core>=1.2.0" ]
build-backend = "poetry.core.masonry.api"
# poetry-core 1.8 not available in .fc39. Can upgrade to 1.8.0 at .fc39 EOL

[tool.poetry-version-plugin]
source = "init"

[tool.poetry]
name = "sherlock-project"
version = "0.1.0"
description = "Hunt down social media accounts by username across social networks, with local-model profile analysis"
license = "MIT"
# Independent derivative of the Sherlock Project; upstream authors and
# maintainers do not maintain this work. Attribution is in NOTICE.md and
# LICENSE. Not published to PyPI under this name — see NOTICE.md#naming.
authors = [
    "sak0x7d5 <70936061+sak0x7d5@users.noreply.github.com>"
]
readme = "docs/pyproject/README.md"
packages = [ { include = "sherlock_project"} ]
keywords = [ "osint", "reconnaissance", "information gathering" ]
classifiers = [
    # Was "5 - Production/Stable", inherited from upstream's 0.16.x line.
    # This project's own line starts at 0.1.0 and has never been released, so
    # claiming production stability was false in both directions.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    # Must track [tool.poetry.dependencies] python (>=3.13). Claiming 3.10-3.12
    # here was false: the package cannot be installed on them at all.
    "Programming Language :: Python :: 3.13",
    "Topic :: Security"
]
homepage = "https://github.com/sak0x7d5/sherlock-osint-remastered"
repository = "https://github.com/sak0x7d5/sherlock-osint-remastered"


[tool.poetry.urls]
"Bug Tracker" = "https://github.com/sak0x7d5/sherlock-osint-remastered/issues"
"Upstream Project" = "https://github.com/sherlock-project/sherlock"

[tool.poetry.dependencies]
# The floor is enforced by the code, not chosen for tidiness: the scan loop in
# sherlock.py drives `async for ... in asyncio.as_completed(...)`, which is
# 3.13+ only and raises TypeError on 3.12. See the comment on that loop before
# lowering this.
python = ">=3.13,<4.0"
certifi = ">=2019.6.16"
rich = "^15.0.0"
PySocks = "^1.7.0"
requests = "^2.22.0"
stem = "^1.8.0"
# pandas/openpyxl were removed with --csv/--xlsx. They existed to serve one
# `DataFrame.to_excel()` call and cost ~74MB installed (pandas 47, numpy 24)
# on a tool that already downloads a browser binary. Structured output is
# `sherlock show <user> --json`; `--txt` still writes a plain URL list.
tomli = "^2.2.1"
playwright = "^1.59.0"
cloakbrowser = {extras = ["geoip"], version = "^0.3.28"}
aiosqlite = "^0.22.1"
httpx = "^0.28.1"
platformdirs = "^4.3.8"
pydantic = "^2.13.4"
tomli-w = "^1.2.0"
trafilatura = "^2.1.0"
textual = "^8.2.8"

[tool.poetry.group.dev.dependencies]
jsonschema = "^4.0.0"
rstr = "^3.2.2"
pytest = "^8.4.2"
pytest-xdist = "^3.8.0"
pytest-asyncio = "^1.3.0"


[tool.poetry.group.ci.dependencies]
defusedxml = "^0.7.1"

[tool.poetry.scripts]
sherlock = 'sherlock_project.sherlock:cli'


[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Ruff's default rule set grows between releases, so the pinned version in
# tox.ini is what keeps lint reproducible. Everything ignored below is a
# deliberate design decision, not a backlog.
ignore = [
    # Failure isolation is this tool's central design property: one site, one
    # AI extraction job, or one cleanup step failing must never abort a scan
    # that is already in flight. The broad handlers implementing that are
    # load-bearing -- see ai_worker, _close_ai_service_and_db, PlaywrightEngine
    # teardown, and the manifest/exclusions fallbacks in sites.py. Narrowing
    # them would convert recoverable degradation into aborted investigations.
    "BLE001",  # blind-except
    "S110",    # try-except-pass
    "S112",    # try-except-continue
]

[tool.ruff.lint.per-file-ignores]
# Report writing happens after every awaited task has completed, so blocking
# file I/O there cannot stall concurrent work.
"sherlock_project/sherlock.py" = ["ASYNC230"]

# This module uses ValueError as its single "malformed baseline report" signal
# and its own callers catch ValueError to fall back. Switching the isinstance
# branches to TypeError as TRY004 suggests would slip past those handlers.
"tests/test_pass_one_local_acceptance.py" = ["TRY004"]

# ValueError is the manifest-parse contract across the loaders: sites.py raises
# it for bad json, and adapt_wmn_site/load_wmn_manifest raise it for unusable
# site rules. A malformed 'sites' array is the same class of failure, so it
# reports the same way. TRY004's TypeError would split one contract in two.
"sherlock_project/wmn_adapter.py" = ["TRY004"]
