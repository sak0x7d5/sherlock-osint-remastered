[tox]
requires =
    tox >= 3
# Only runtimes satisfying pyproject's `python = ">=3.13,<4.0"` are listed.
# py310-py312 were unbuildable and failed at the install step.
envlist =
    lint
    py313

[testenv]
description = Attempt to build and install the package
deps =
    coverage
    jsonschema
    pytest
    rstr
allowlist_externals = coverage
commands =
    coverage run --source=sherlock_project --module pytest -v
    coverage report --show-missing

[testenv:offline]
deps =
    jsonschema
    pytest
commands =
    pytest -v -m "not online"

[testenv:lint]
description = Lint with Ruff
deps =
    ruff
commands =
    ruff check

[gh-actions]
python =
    3.13: py313
