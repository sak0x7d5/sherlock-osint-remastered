[tox]
requires =
    tox >= 3
# Only runtimes satisfying pyproject's `python = ">=3.13,<4.0"` are listed.
# py310-py312 were unbuildable and failed at the install step.
envlist =
    lint
    py313

# These must mirror [tool.poetry.group.dev.dependencies] in pyproject.toml,
# with matching bounds, or tox and `poetry install --with dev` test against
# different versions. They had already drifted: pytest-asyncio was absent here
# even though tests/conftest.py imports it, and pytest was unpinned and
# resolved to 9.x against pyproject's ^8.4.2. coverage is the one deliberate
# addition, since only tox measures it.
# Folding these two lists into one belongs with the pyproject modernisation.
# The default env is the push gate, so its selection is deterministic: no test
# here touches a network it does not control. Live-site checks live in the
# online env below.
#
# Both -m terms are spelled out because pytest takes a single -m, and one given
# on the command line replaces the "not validate_targets" in pytest.ini rather
# than combining with it.
[testenv]
description = Build and install the package, then run the hermetic suite
deps =
    coverage>=7.0,<8.0
    jsonschema>=4.0.0,<5.0.0
    pytest>=8.4.2,<9.0.0
    pytest-asyncio>=1.3.0,<2.0.0
    pytest-xdist>=3.8.0,<4.0.0
    rstr>=3.2.2,<4.0.0
allowlist_externals = coverage
commands =
    coverage run --source=sherlock_project --module pytest -v -m "not online and not validate_targets"
    coverage report --show-missing

# deps are inherited from [testenv] so there is one list to keep current.
[testenv:offline]
description = Same selection as the default env, without coverage
commands =
    pytest -v -m "not online and not validate_targets"

[testenv:online]
description = Live-target probes. Network dependent, never a push gate.
# These drive a real browser against third-party sites, so they can fail
# because a site changed, rate-limited a CI address, or blocked the stealth
# browser. A failure means investigate, not revert. Run on a schedule via
# .github/workflows/live-targets.yml.
commands =
    pytest -v -m "online and not validate_targets"

[testenv:lint]
description = Lint with Ruff
# Ruff reads source files; it does not import the package. Skipping the build
# and dependency install takes this env from ~33s of setup to ~2s.
skip_install = true
# Pinned deliberately. Ruff enables new rules in its default set as it grows,
# so an unpinned version turns a green branch red without a code change.
# Bump this on purpose, then fix what the new version finds.
deps =
    ruff==0.16.2
commands =
    ruff check

[gh-actions]
python =
    3.13: py313
