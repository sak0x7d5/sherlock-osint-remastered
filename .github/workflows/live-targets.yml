name: Live Target Probes

# Network-dependent checks against real sites, deliberately kept off the push
# path. These drive a stealth browser at third-party services, so they can go
# red because a site changed its markup, rate-limited a CI address, or blocked
# the browser outright -- none of which means the commit under test is broken.
#
# A failure here is a signal to investigate the site rule, not to revert code.
# Regression testing remains the gate for every push.

on:
  schedule:
    # Weekly. Site rules drift on the order of weeks, and this repository is
    # private, where scheduled runs consume the Actions allowance.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-targets
  cancel-in-progress: true

jobs:
  probe:
    name: Probe live targets
    runs-on: ubuntu-latest
    # A blocked or hanging request must not idle a runner indefinitely.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox

      # The first run downloads a stealth browser binary, so expect this step
      # to be slow before any probe is attempted.
      - name: Run live target probes
        run: tox -e online
