name: Site Rules

# Validates the LEGACY site manifest and keeps the generated site listing
# honest. data.json is no longer the default manifest -- it is reachable only
# through `--json` -- so this workflow guards a compatibility path, not the
# scanner's normal input.
#
# The bundled WMN manifest is NOT covered here, and deliberately so:
# devel/site-list.py reads data.json unconditionally, so widening the path
# filter would make this pass vacuously on WMN-only changes. wmn-data.json is
# schema-checked by tests/test_wmn_adapter.py, which regression.yml already
# runs on any '**/*.json' change. Normalization and a generated listing for the
# WMN manifest have no equivalent yet, so the README's site-category table is
# maintained by hand and needs re-checking after a WMN refresh.
#
# This derivative owns its own site data. Upstream's variant of this workflow
# pushed generated output into the Sherlock Project's website repository using
# their deploy secrets; that step is not ours to run. See NOTICE.md.

on:
  pull_request:
    paths:
      - '.github/workflows/update-site-list.yml'
      - 'devel/site-list.py'
      - 'docs/sites.md'
      - 'sherlock_project/resources/data.json'
      - 'sherlock_project/resources/data.schema.json'
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - '.github/workflows/update-site-list.yml'
      - 'devel/site-list.py'
      - 'docs/sites.md'
      - 'sherlock_project/resources/data.json'
      - 'sherlock_project/resources/data.schema.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate manifest and listing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # site-list.py needs only jsonschema, so this stays independent of the
      # project's runtime dependencies and runs in seconds.
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      # Verifies three things at once: the manifest conforms to the schema
      # bundled here, it is in normalized form, and docs/sites.md was
      # regenerated alongside it. Prints a diff and remediation on failure.
      - name: Validate site rules
        run: python devel/site-list.py --check
