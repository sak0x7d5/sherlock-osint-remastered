blank_issues_enabled: false

# These links exist because three of the commonest reports are not actionable in
# this repository, and routing them correctly is faster for everyone than closing
# them here. See NOTICE.md.
contact_links:
  - name: A new site, or a wrong detection rule
    url: https://github.com/WebBreacher/WhatsMyName/issues
    about: Site rules come from the WhatsMyName dataset, vendored here unmodified. Fixing them there reaches this project on the next refresh, and every other tool built on the dataset.

  - name: A bug in the original Sherlock
    url: https://github.com/sherlock-project/sherlock/issues
    about: This is an independent derivative and shares none of upstream's maintainers. If you installed with pip, pipx, Homebrew or apt, you are running upstream's release, not this project.

  - name: A security vulnerability
    url: https://github.com/sak0x7d5/sherlock-osint-remastered/security/advisories/new
    about: Report privately rather than opening a public issue.
