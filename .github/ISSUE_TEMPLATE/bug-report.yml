name: Bug report
description: File a bug report
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is an **independent derivative** of the Sherlock Project, and shares
        none of its maintainers.

        If you installed with `pip`, `pipx`, Homebrew, or `apt`, you are running
        **upstream's** release and not this project. Report that
        [to the Sherlock Project](https://github.com/sherlock-project/sherlock/issues)
        instead — nothing here can fix it.
  - type: dropdown
    id: package
    attributes:
      label: Installation method
      description: |
        This project is not published to any package index, so the list is short.
        If the option you used is missing, that is itself worth knowing.
      options:
        - Select one
        - From source (git clone + poetry install)
        - Docker
        - Other (indicate below)
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Version
      description: |
        Output of `sherlock --version`. If you are running from a git checkout,
        the commit hash (`git rev-parse --short HEAD`) is more useful than the
        version number.
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Which fetch mode?
      description: |
        The two engines behave differently by design. `--no-webbrowser` runs no
        JavaScript, so a site that builds its profile page in the browser can
        report a real account as absent. That is documented behaviour rather than
        a bug, and knowing which mode you used saves a round trip.
      options:
        - Select one
        - Stealth browser (the default)
        - Fast / no browser (--no-webbrowser)
        - Not sure
        - Not relevant to this bug
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Detailed descriptions that help contributors understand and reproduce your bug are much more likely to lead to a fix.
        Please include the following information:
        - What you were trying to do
        - What you expected to happen
        - What actually happened
      placeholder: |
        When doing {action}, the expected result should be {expected result}.
        When doing {action}, however, the actual result was {actual result}.
        This is undesirable because {reason}.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Write a step by step list that will allow us to reproduce this bug.
      placeholder: |
        1. Do something
        2. Then do something else
    validations:
      required: true
  - type: textarea
    id: additional-info
    attributes:
      label: Additional information
      description: |
        Anything else worth knowing. Output from `--verbose` is often the fastest
        route to a diagnosis.

        Please do not paste scan results for a real person, or the contents of
        your database. Redact usernames and profile details to whatever the bug
        actually needs.
    validations:
      required: false
